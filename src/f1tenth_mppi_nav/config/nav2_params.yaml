controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /ego_racecar/odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.3

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      # Ceiling only. The speed_profile node rewrites this at 50 Hz over
      # /speed_limit with the TUM profile speed for wherever the car is on the
      # raceline, so this must stay equal to V_MAX in convert_and_plot.py --
      # nav2 scales wz and vx_min by (speed_limit / vx_max) alongside it.
      vx_max: 2.5
      vx_min: -0.5
      vy_max: 0.0
      # Holding the raceline needs wz = v*|kappa|, and setSpeedLimit scales
      # this cap by v/vx_max, so v cancels: the binding condition is just
      # wz_max >= vx_max * |kappa|max = 3.0 * 1.104 = 3.31 for big_0723.
      # At 1.6 the tightest corner was unreachable (needs 2.35 rad/s) whether
      # or not a speed limit was published. Re-check this when raising vx_max.
      # Not a grip risk: 1.104 1/m is 0.327 rad of steer (limit 0.4189) and
      # AckermannConstraints.min_turning_r still caps wz at v/0.69 on top.
      wz_max: 3.5
      iteration_count: 1
      prune_distance: 5.5
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: true
      AckermannConstraints:
        min_turning_r: 0.69
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        # Divided by 254 internally before use, because it multiplies a raw
        # costmap cost (0-254); that brings the product into the same regime as
        # the other critics' scores. The number written HERE is therefore
        # pre-normalization -- do not compare it to PathAlignCritic's 14.0.
        # Tune it relative to 3.81, which is the nav2 default. Higher = avoid
        # obstacles harder at the expense of following the raceline.
        cost_weight: 3.81
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.5
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.00
        offset_from_furthest: 12
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: ego_racecar/base_link
      rolling_window: true
      width: 14
      height: 14
      resolution: 0.05
      # CostCritic treats cost 253 (= within this radius of a wall) as a hard
      # collision and throws the whole rollout away at 1e6, so this radius is
      # the band the car physically cannot enter. At 0.33 that killed the
      # raceline's tightest apexes outright -- min clearance on big_0723 is
      # 0.292 m and 4.4% of the line sat inside the band. 0.22 clears the
      # tightest apex by 7.2 cm while still covering the 0.15 m half-width that
      # extract_track_widths.py assumes, plus 7 cm.
      # Note base_link is at the REAR AXLE (bringup_launch.py puts laser at
      # x=+0.27, wheelbase 0.307), so the front bumper sits at x~0.40 and no
      # circle under r=0.43 ever covered it -- 0.33 bought no longitudinal
      # protection, only a lateral penalty. Switch to a footprint polygon if
      # front-end clearance ever needs to be real.
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: ego_racecar/base_link
      robot_radius: 0.33
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: True

# Note: map_server is intentionally not configured/launched here - it's
# already brought up by f1tenth_gym_ros's own gym_bridge_launch.py, and
# both mppi_bringup_launch.py and mppi_path_follow_launch.py reuse that
# instance instead of running a conflicting second one under the same
# node name (see README).

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: ego_racecar/base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
