amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: /scan

    # Hokuyo UST-10LX: 10m 사거리, 실내 좁은 트랙이라 beam 수를 넉넉히 사용
    laser_model_type: "likelihood_field"
    laser_max_range: 10.0
    laser_min_range: 0.1
    max_beams: 180
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0

    # 차량이 작고 빠르게 도므로 파티클을 넉넉히, 갱신 주기를 짧게
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.05
    update_min_a: 0.1
    resample_interval: 1
    transform_tolerance: 0.5

    # Ackermann 차량 = 후륜구동 차동 모델로 근사
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    save_pose_rate: 0.5
    tf_broadcast: true
    always_reset_initial_pose: false
    first_map_only: false

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "/home/swlee/roboracer_ws/maps/track_real.yaml"
    topic_name: "map"
    frame_id: "map"
